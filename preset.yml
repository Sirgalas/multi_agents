name: AnyModel AI Orchestrator Pipeline Preset
version: "1.0"
agent:
  name: cordis-orchestrator
  environment:
    ANYMODEL_BASE_URL: "https://anymodel.org/v1"
    ANYMODEL_API_KEY: "${ANYMODEL_API_KEY}"
    JAVA_HOME: "/usr/lib/jvm/java-26-openjdk"
  roles:
    architect:
      model: "cc/claude-sonnet-4-6"
      temperature: 0.3
      max_tokens: 8192
    backend-analyst:
      model: "cc/claude-sonnet-4-6"
      temperature: 0.3
      max_tokens: 8192
    frontend-analyst:
      model: "cc/claude-sonnet-4-6"
      temperature: 0.3
      max_tokens: 8192
    designer:
      model: "cc/claude-sonnet-4-6"
      temperature: 0.4
      max_tokens: 8192
    backend-developer:
      model: "ag/gemini-3.7-flash-high"
      temperature: 0.2
      max_tokens: 16384
    frontend-developer:
      model: "ag/gemini-3.7-flash-high"
      temperature: 0.2
      max_tokens: 16384
    tester:
      model: "ag/gemini-3.7-flash-high"
      temperature: 0.1
      max_tokens: 8192
    helper:
      model: "ag/gemini-3.6-flash-high"
      temperature: 0.2
      max_tokens: 8192

pipeline:
  steps:
    - name: ARCHITECT
      enabled: true
    - name: BACKEND_ANALYST
      enabled: true
    - name: FRONTEND_ANALYST
      enabled: true
    - name: DESIGNER
      enabled: true
    - name: BACKEND_DEVELOPER
      enabled: true
    - name: FRONTEND_DEVELOPER
      enabled: true
    - name: TESTER
      enabled: true
    - name: HELPER
      enabled: true
    - name: ARCHIVER
      enabled: true