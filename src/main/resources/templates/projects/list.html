<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Проекты</title>
</head>
<body>
<div layout:fragment="header">Управление Проектами</div>

<div layout:fragment="content">
    <div class="row">
        <!-- New Project Form -->
        <div class="col-md-4">
            <div class="card card-primary">
                <div class="card-header">
                    <h3 class="card-title"><i class="fas fa-plus-circle mr-1"></i> Создать Проект</h3>
                </div>
                <form th:action="@{/projects}" method="post" th:object="${createProjectRequest}">
                    <div class="card-body">
                        <div class="form-group">
                            <label for="name">Название проекта</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Введите название..." required>
                        </div>
                        <div class="form-group">
                            <label for="description">Описание / Исходная задача</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="5" placeholder="Опишите требования к системе..."></textarea>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button type="submit" class="btn btn-primary btn-block">Создать проект</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Project List Table -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title"><i class="fas fa-list mr-1"></i> Список Ваших Проектов</h3>
                </div>
                <div class="card-body table-responsive p-0">
                    <table class="table table-hover text-nowrap">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Файлов</th>
                            <th>Шагов</th>
                            <th>Дата создания</th>
                            <th>Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="project : ${projects}">
                            <td th:text="${project.id}">1</td>
                            <td>
                                <a th:href="@{/projects/{id}(id=${project.id})}" class="font-weight-bold text-primary" th:text="${project.name}">Проект</a>
                            </td>
                            <td><span class="badge badge-info" th:text="${project.filesCount}">0</span></td>
                            <td><span class="badge badge-secondary" th:text="${project.stepsCount}">0</span></td>
                            <td th:text="${#temporals.format(project.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
                            <td>
                                <a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-sm btn-primary"><i class="fas fa-external-link-alt"></i> Открыть</a>
                                <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post" style="display:inline-block;" onsubmit="return confirm('Удалить проект?');">
                                    <button type="submit" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(projects)}">
                            <td colspan="6" class="text-center text-muted py-4">Проекты не найдены. Создайте первый проект!</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
