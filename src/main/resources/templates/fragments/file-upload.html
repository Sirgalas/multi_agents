<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="file-upload" class="card card-secondary">
    <div class="card-header">
        <h3 class="card-title"><i class="fas fa-paperclip mr-1"></i> Контекстные файлы проекта</h3>
        <div class="card-tools">
            <button type="button" class="btn btn-tool" data-toggle="modal" data-target="#modal-upload-file">
                <i class="fas fa-plus"></i> Добавить файл
            </button>
        </div>
    </div>
    <div class="card-body p-0">
        <table class="table table-striped table-valign-middle mb-0">
            <thead>
            <tr>
                <th>Имя файла</th>
                <th>Тип</th>
                <th>Символов</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(contexts)}">
                <td colspan="3" class="text-center text-muted">Файлы контекста отсутствуют</td>
            </tr>
            <tr th:each="ctx : ${contexts}">
                <td>
                    <i class="far fa-file-code mr-1 text-primary"></i>
                    <strong th:text="${ctx.fileName}">file.txt</strong>
                </td>
                <td>
                    <span class="badge badge-secondary" th:text="${ctx.fileType}">TASK</span>
                </td>
                <td th:text="${#strings.length(ctx.fileContent)}">0</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
