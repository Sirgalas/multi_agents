<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="main-sidebar sidebar-dark-primary elevation-4">
    <!-- Brand Logo -->
    <a th:href="@{/projects}" class="brand-link">
        <i class="fas fa-network-wired ml-3 mr-2"></i>
        <span class="brand-text font-weight-light">Agent Orchestrator</span>
    </a>

    <!-- Sidebar -->
    <div class="sidebar">
        <!-- New Project Button -->
        <div class="pt-3 pb-2">
            <button class="btn btn-block btn-success btn-sm" data-toggle="modal" data-target="#modal-create-project">
                <i class="fas fa-plus mr-1"></i> Новый проект
            </button>
        </div>

        <!-- Sidebar Menu -->
        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                <li class="nav-header">ВАШИ ПРОЕКТЫ</li>
                <li th:if="${#lists.isEmpty(projects)}" class="nav-item">
                    <span class="nav-link text-muted"><i class="far fa-circle nav-icon"></i> Нет проектов</span>
                </li>
                <li th:each="proj : ${projects}" class="nav-item">
                    <a th:href="@{'/projects/' + ${proj.id}}"
                       class="nav-link"
                       th:classappend="${currentProject != null and currentProject.id == proj.id} ? ' active' : ''">
                        <i class="nav-icon fas fa-folder"></i>
                        <p>
                            <span th:text="${proj.name}">Проект</span>
                            <span class="badge badge-info right" th:text="${proj.stepCount}">0</span>
                        </p>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</aside>
</body>
</html>
