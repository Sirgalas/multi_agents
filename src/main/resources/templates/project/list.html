<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
    <title>Projects Dashboard</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Orchestrated Projects</h2>
        <a th:href="@{/wizard/step1}" class="btn btn-primary"><i class="fas fa-plus"></i> Create Project Wizard</a>
    </div>

    <div class="row" th:if="${#lists.isEmpty(projects)}">
        <div class="col-12">
            <div class="alert alert-info">
                <h5><i class="icon fas fa-info"></i> No Projects Yet!</h5>
                Start orchestrating by clicking the "Create Project Wizard" button.
            </div>
        </div>
    </div>

    <div class="row" th:unless="${#lists.isEmpty(projects)}">
        <div class="col-md-4" th:each="p : ${projects}">
            <div class="card card-outline card-primary shadow-sm">
                <div class="card-header">
                    <h3 class="card-title font-weight-bold" th:text="${p.name}">Project Name</h3>
                </div>
                <div class="card-body">
                    <p class="text-muted" th:text="${p.description != null ? p.description : 'No description provided'}"></p>
                    <p><small class="text-secondary"><i class="far fa-clock"></i> Created: <span th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}"></span></small></p>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <a th:href="@{/projects/{id}(id=${p.id})}" class="btn btn-sm btn-info"><i class="fas fa-eye"></i> Details & Pipeline</a>
                    <a th:href="@{/projects/{id}/download(id=${p.id})}" class="btn btn-sm btn-success"><i class="fas fa-download"></i> Download ZIP</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
