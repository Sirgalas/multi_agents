<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
  <title>Мои Проекты</title>
</head>
<body>
<div layout:fragment="content">
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0">Список Проектов</h1>
        </div>
        <div class="col-sm-6 text-right">
          <a th:href="@{/projects/new}" class="btn btn-primary"><i class="fas fa-plus"></i> Создать проект</a>
        </div>
      </div>
    </div>
  </div>

  <section class="content">
    <div class="container-fluid">
      <div class="card">
        <div class="card-body table-responsive p-0">
          <table class="table table-hover text-nowrap">
            <thead>
            <tr>
              <th>ID</th>
              <th>Название</th>
              <th>Тип</th>
              <th>Описание</th>
              <th>Статус</th>
              <th>Создан</th>
              <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="project : ${projects}">
              <td th:text="${project.id}"></td>
              <td><strong th:text="${project.name}"></strong></td>
              <td>
                <span class="badge" 
                      th:classappend="${project.type != null && project.type.name() == 'BACKEND_ONLY' ? 'badge-success' : (project.type != null && project.type.name() == 'FRONTEND_ONLY' ? 'badge-info' : 'badge-primary')}"
                      th:text="${project.type != null ? (project.type.name() == 'BACKEND_ONLY' ? 'Бэкенд' : (project.type.name() == 'FRONTEND_ONLY' ? 'Фронтенд' : 'Fullstack')) : 'Fullstack'}">
                </span>
              </td>
              <td th:text="${project.description}"></td>
              <td>
                <span class="badge" 
                      th:classappend="${project.status == 'COMPLETED' ? 'badge-success' : (project.status == 'IN_PROGRESS' ? 'badge-primary' : (project.status == 'WAITING_FOR_INPUT' ? 'badge-warning' : 'badge-secondary'))}"
                      th:text="${project.status}">
                </span>
              </td>
              <td th:text="${#temporals.format(project.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
              <td>
                <a th:href="@{'/projects/' + ${project.id}}" class="btn btn-sm btn-info"><i class="fas fa-desktop"></i> Рабочая область</a>
                <a th:href="@{'/interview/' + ${project.id}}" class="btn btn-sm btn-secondary"><i class="fas fa-comments"></i> Чат ТЗ</a>
                <a th:if="${project.archivePath != null}" th:href="@{'/projects/' + ${project.id} + '/download'}" class="btn btn-sm btn-success"><i class="fas fa-download"></i> ZIP</a>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
