<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
    <title>Step 1: Select Template</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-primary card-outline shadow">
                <div class="card-header">
                    <h3 class="card-title font-weight-bold"><i class="fas fa-list-check text-primary"></i> Step 1: Select Technical Task Template</h3>
                </div>
                <form th:action="@{/wizard/step1}" method="post">
                    <div class="card-body">
                        <div class="form-group mb-3">
                            <label for="templateSelect" class="form-label">Task Template (Select2):</label>
                            <select id="templateSelect" name="templateId" class="form-control select2" style="width: 100%;" required>
                                <option value="">-- Choose a Task Template --</option>
                                <option th:each="tmpl : ${taskTemplates}" 
                                        th:value="${tmpl.id}" 
                                        th:text="${tmpl.name}"
                                        th:data-description="${tmpl.description}"
                                        th:data-structure="${tmpl.fileStructureTemplate != null ? tmpl.fileStructureTemplate.structureTree : 'No Structure'}">
                                </option>
                            </select>
                        </div>

                        <div id="previewBox" class="mt-4" style="display:none;">
                            <h5><i class="fas fa-info-circle text-info"></i> Template Preview</h5>
                            <p id="templateDescription" class="text-muted"></p>
                            <label>File Structure Architecture:</label>
                            <pre id="templateStructure" class="bg-dark text-light p-3 rounded" style="max-height: 250px; overflow-y: auto;"></pre>
                        </div>
                    </div>
                    <div class="card-footer text-right">
                        <button type="submit" class="btn btn-primary px-4 font-weight-bold">Next: Edit Task (Step 2) <i class="fas fa-arrow-right"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
    $(document).ready(function() {
        $('.select2').select2({
            theme: 'classic'
        });

        $('#templateSelect').on('change', function() {
            var selected = $(this).find(':selected');
            var desc = selected.data('description');
            var structure = selected.data('structure');

            if (desc) {
                $('#templateDescription').text(desc);
                $('#templateStructure').text(structure);
                $('#previewBox').slideDown();
            } else {
                $('#previewBox').slideUp();
            }
        });
    });
</script>
</th:block>
</body>
</html>
