<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
    <title>Step 2: Edit Task</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card card-primary card-outline shadow">
        <div class="card-header">
            <h3 class="card-title font-weight-bold"><i class="fas fa-edit text-primary"></i> Step 2: WYSIWYG / Markdown Task Editor</h3>
        </div>
        <form th:action="@{/wizard/step2}" method="post">
            <div class="card-body">
                <div class="form-group mb-3">
                    <label for="taskEditor" class="form-label">Refine Technical Requirements & Prompts for Agents:</label>
                    <textarea id="taskEditor" name="content" class="form-control" rows="18" th:text="${content}"></textarea>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <a th:href="@{/wizard/step1}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Step 1</a>
                <button type="submit" class="btn btn-primary px-4 font-weight-bold">Next: Finalize & Run (Step 3) <i class="fas fa-arrow-right"></i></button>
            </div>
        </form>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
    var simplemde = new SimpleMDE({ 
        element: document.getElementById("taskEditor"),
        spellChecker: false,
        placeholder: "Write or refine your technical task in Markdown format..."
    });
</script>
</th:block>
</body>
</html>
