<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">AI Orchestrator</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.2/css/all.min.css}">
  <!-- Theme style AdminLTE -->
  <link rel="stylesheet" th:href="@{/webjars/AdminLTE/3.2.0/dist/css/adminlte.min.css}">
  <!-- Select2 -->
  <link rel="stylesheet" th:href="@{/webjars/select2/4.0.13/css/select2.min.css}">
  <!-- EasyMDE WYSIWYG Editor -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
  
  <style>
    .brand-link { font-weight: 600; }
    .nav-icon { margin-right: 0.5rem; }
  </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a th:href="@{/}" class="nav-link">Главная</a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a th:href="@{/projects}" class="nav-link">Проекты</a>
      </li>
    </ul>

    <ul class="navbar-nav ml-auto">
      <li class="nav-item" sec:authorize="isAuthenticated()">
        <span class="nav-link text-muted">
          <i class="fas fa-user mr-1"></i> <span sec:authentication="name"></span>
        </span>
      </li>
      <li class="nav-item" sec:authorize="isAuthenticated()">
        <form th:action="@{/logout}" method="post" class="d-inline">
          <button type="submit" class="btn btn-link nav-link"><i class="fas fa-sign-out-alt"></i> Выход</button>
        </form>
      </li>
    </ul>
  </nav>

  <!-- Main Sidebar Container -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a th:href="@{/}" class="brand-link">
      <i class="fas fa-brain brand-image img-circle elevation-3 ml-3 mt-1"></i>
      <span class="brand-text font-weight-light">AI Orchestrator</span>
    </a>

    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">
            <a th:href="@{/}" class="nav-link">
              <i class="nav-icon fas fa-tachometer-alt"></i>
              <p>Панель управления</p>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/projects}" class="nav-link">
              <i class="nav-icon fas fa-folder"></i>
              <p>Мои Проекты</p>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/projects/new}" class="nav-link">
              <i class="nav-icon fas fa-magic"></i>
              <p>Мастер создания</p>
            </a>
          </li>
          <li class="nav-header" sec:authorize="hasRole('ADMIN')">АДМИНИСТРИРОВАНИЕ</li>
          <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/users}" class="nav-link">
              <i class="nav-icon fas fa-users-cog"></i>
              <p>Пользователи</p>
            </a>
          </li>
          <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/mcp-servers}" class="nav-link">
              <i class="nav-icon fas fa-server"></i>
              <p>MCP Серверы</p>
            </a>
          </li>
          <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/prompts}" class="nav-link">
              <i class="nav-icon fas fa-terminal"></i>
              <p>Промпты агентов</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Content Wrapper -->
  <div class="content-wrapper">
    <div layout:fragment="content"></div>
  </div>

  <footer class="main-footer">
    <div class="float-right d-none d-sm-inline">
      Java 21 LTS | Spring Boot 3.4
    </div>
    <strong>Spring AI Multi-Agent Orchestrator &copy; 2025</strong>
  </footer>
</div>

<!-- jQuery -->
<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<!-- Bootstrap 4 -->
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<!-- AdminLTE App -->
<script th:src="@{/webjars/AdminLTE/3.2.0/dist/js/adminlte.min.js}"></script>
<!-- Select2 -->
<script th:src="@{/webjars/select2/4.0.13/js/select2.full.min.js}"></script>
<!-- EasyMDE -->
<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>

<div layout:fragment="scripts"></div>
</body>
</html>
