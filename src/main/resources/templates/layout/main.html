<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Spring AI Multi-Agent Orchestrator</title>

    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome -->
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
    <!-- AdminLTE Theme style -->
    <link rel="stylesheet" th:href="@{/webjars/admin-lte/3.2.0/dist/css/adminlte.min.css}">
    <!-- Custom styling -->
    <style>
        .pre-scrollable-custom {
            max-height: 450px;
            overflow-y: auto;
            background-color: #1e1e1e;
            color: #dcdcdc;
            padding: 15px;
            border-radius: 4px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .agent-badge-ARCHITECT { background-color: #6f42c1; color: white; }
        .agent-badge-WORKER { background-color: #007bff; color: white; }
        .agent-badge-TESTER { background-color: #28a745; color: white; }
        .agent-badge-HELPER { background-color: #fd7e14; color: white; }
        .cursor-pointer { cursor: pointer; }
    </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
                <a th:href="@{/projects}" class="nav-link">Главная</a>
            </li>
        </ul>

        <ul class="navbar-nav ml-auto">
            <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                <a class="nav-link" data-toggle="dropdown" href="#">
                    <i class="far fa-user mr-1"></i>
                    <span sec:authentication="name">User</span>
                </a>
                <div class="dropdown-menu dropdown-menu-right">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="fas fa-sign-out-alt mr-2"></i> Выйти
                        </button>
                    </form>
                </div>
            </li>
        </ul>
    </nav>

    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <div layout:fragment="content">
            <!-- Dynamic view injected here -->
        </div>
    </div>

    <!-- Modals Fragment -->
    <div th:replace="~{fragments/modals :: modals}"></div>

    <!-- Main Footer -->
    <footer class="main-footer text-sm">
        <strong>Spring AI Orchestrator &copy; 2025</strong> Multi-Agent Development Pipeline.
    </footer>
</div>

<!-- jQuery -->
<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<!-- Bootstrap 4 -->
<script th:src="@{/webjars/bootstrap/4.6.2/js/bootstrap.bundle.min.js}"></script>
<!-- AdminLTE App -->
<script th:src="@{/webjars/admin-lte/3.2.0/dist/js/adminlte.min.js}"></script>

<div layout:fragment="scripts">
    <!-- View-specific scripts -->
</div>
</body>
</html>
