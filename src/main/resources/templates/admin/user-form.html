<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
    <title>Create User</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card card-primary col-md-6 offset-md-3">
        <div class="card-header">
            <h3 class="card-title">Create New User</h3>
        </div>
        <form th:action="@{/admin/users}" th:object="${userForm}" method="post">
            <div class="card-body">
                <div class="form-group mb-3">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="Enter username" required>
                    <span class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>
                <div class="form-group mb-3">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Enter password" required>
                    <span class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
                <div class="form-group mb-3">
                    <label for="role">Role</label>
                    <select class="form-control" id="role" th:field="*{role}">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save User</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
