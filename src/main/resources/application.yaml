spring:
  application:
    name: ai-orchestrator
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orchestrator_db}
    username: ${SPRING_DATASOURCE_USERNAME:orchestrator_user}
    password: ${SPRING_DATASOURCE_PASSWORD:strong_password_here}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: 30m

anymodel:
  api:
    key: ${ANYMODEL_API_KEY:mock_key}
    base:
      url: ${ANYMODEL_BASE_URL:https://anymodel.org/v1}

app:
  admin:
    user:
      name: ${APP_ADMIN_USER_NAME:admin}
      password: ${APP_ADMIN_USER_PASSWORD:admin123}
  output:
    directory: ${OUTPUT_DIR:./output}

logging:
  level:
    ru.sergalas.orchestrator: DEBUG
    org.springframework.security: INFO
    org.springframework.ai: INFO