spring:
  application:
    name: ai-orchestrator
  ai:
    openai:
      api-key: ${ANYMODEL_API_KEY:mock_key}
      base-url: ${ANYMODEL_BASE_URL:https://anymodel.org/v1}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orchestrator}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres_secure_password_here}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
anymodel:
  api:
    key: ${ANYMODEL_API_KEY:mock_key}
    base:
      url: ${ANYMODEL_BASE_URL:https://anymodel.org/v1}
agents:
  all:
    url: ${AGENTS_ALL_URL:${anymodel.api.base.url}}
    token: ${AGENTS_ALL_TOKEN:${anymodel.api.key}}
  interviewer:
    url: ${INTERVIEWER_URL:${agents.all.url}}
    token: ${INTERVIEWER_TOKEN:${agents.all.token}}
    model: ${INTERVIEWER_MODEL:ag/gemini-3.7-flash-high}
  architect:
    url: ${ARCHITECT_URL:${agents.all.url}}
    token: ${ARCHITECT_TOKEN:${agents.all.token}}
    model: ${ARCHITECT_MODEL:cc/claude-sonnet-4-6}
  backend-analyst:
    url: ${BACKEND_ANALYST_URL:${agents.architect.url}}
    token: ${BACKEND_ANALYST_TOKEN:${agents.architect.token}}
    model: ${BACKEND_ANALYST_MODEL:${agents.architect.model}}
  frontend-analyst:
    url: ${FRONTEND_ANALYST_URL:${agents.architect.url}}
    token: ${FRONTEND_ANALYST_TOKEN:${agents.architect.token}}
    model: ${FRONTEND_ANALYST_MODEL:${agents.architect.model}}
  designer:
    url: ${DESIGNER_URL:${agents.architect.url}}
    token: ${DESIGNER_TOKEN:${agents.architect.token}}
    model: ${DESIGNER_MODEL:${agents.architect.model}}
  backend-developer:
    url: ${BACKEND_DEVELOPER_URL:${agents.all.url}}
    token: ${BACKEND_DEVELOPER_TOKEN:${agents.all.token}}
    model: ${BACKEND_DEVELOPER_MODEL:${agents.all.model:ag/gemini-3.7-flash-high}}
  frontend-developer:
    url: ${FRONTEND_DEVELOPER_URL:${agents.all.url}}
    token: ${FRONTEND_DEVELOPER_TOKEN:${agents.all.token}}
    model: ${FRONTEND_DEVELOPER_MODEL:${agents.all.model:ag/gemini-3.7-flash-high}}
  tester:
    url: ${TESTER_URL:${agents.all.url}}
    token: ${TESTER_TOKEN:${agents.all.token}}
    model: ${TESTER_MODEL:ag/gemini-3.7-flash-high}
  helper:
    url: ${HELPER_URL:${agents.all.url}}
    token: ${HELPER_TOKEN:${agents.all.token}}
    model: ${HELPER_MODEL:ag/gemini-3.7-flash-high}

app:
  admin:
    user:
      name: ${APP_ADMIN_USER_NAME:admin}
      password: ${APP_ADMIN_USER_PASSWORD:admin123}
  output:
    directory: ${OUTPUT_DIRECTORY:./output}

mcp:
  default-servers:
    # Backend & Database
    - name: "Spring Boot Guidelines"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/spring_boot"
      transport: SSE
      default-selected: true
      target: BACKEND
      description: "Spring Boot 3.4+, Java 21 LTS records for DTOs, constructor injection, @Valid, RFC 7807 ProblemDetail, Spring Data JPA with explicit transactions."
    - name: "Hibernate ORM Best Practices"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/hibernate"
      transport: SSE
      default-selected: true
      target: BACKEND
      description: "Avoid N+1 queries using EntityGraph/JOIN FETCH, use database indexes on FKs, immutable projections, bidirectional helper methods, validate ddl-auto."
    - name: "Java Modern Conventions"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/openjdk~21"
      transport: SSE
      default-selected: true
      target: BACKEND
      description: "Idiomatic Java 21, sealed interfaces, record patterns, pattern matching for switch, virtual threads for I/O, immutable collections."
    - name: "PostgreSQL Best Practices"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/postgresql~16"
      transport: SSE
      default-selected: true
      target: BACKEND
      description: "Use UUID/bigserial PKs, JSONB for flexible attributes, TIMESTAMP WITH TIME ZONE, Flyway schema migrations, proper index coverage."

    # Frontend (React & Web)
    - name: "React Guidelines & Hooks"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/react"
      transport: SSE
      target: FRONTEND
      description: "Functional components, TypeScript strict types, custom hooks for business logic, memoization for expensive renders, clean state management."
    - name: "Next.js Fullstack Architecture"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/nextjs"
      transport: SSE
      target: FRONTEND
      description: "App Router architecture, React Server Components by default, Client Components with 'use client', Server Actions for mutations."

    # Mobile (React Native, Flutter & Dart)
    - name: "React Native Mobile Standards"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/react_native"
      transport: SSE
      target: FRONTEND
      description: "Modular components, platform-specific adaptations (iOS/Android), offline-first caching, background services handling, smooth animations."
    - name: "Flutter Framework & UI Widgets"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/flutter"
      transport: SSE
      target: FRONTEND
      description: "State management (Bloc/Riverpod), const widgets for rebuild optimization, responsive layouts, repository pattern for API abstraction."
    - name: "Dart Language Conventions"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/dart"
      transport: SSE
      target: FRONTEND
      description: "Strict null-safety, effective Dart naming, async/await with error handling, immutable data models."

    # Web Standards, Languages & Styling
    - name: "TypeScript Strict Typing & Config"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/typescript"
      transport: SSE
      target: FRONTEND
      description: "Strict mode enabled, no 'any' types, discriminated unions for state, explicit return types for API contracts."
    - name: "JavaScript (ES6+ / Modern JS)"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/javascript"
      transport: SSE
      target: FRONTEND
      description: "ES2024+ syntax, async/await, modular ES modules, immutability patterns, structured error handling."
    - name: "HTML5 & Web Components"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/html"
      transport: SSE
      target: FRONTEND
      description: "Semantic HTML5 elements (header, main, section, nav, article), accessible ARIA labels, standards-compliant layout."
    - name: "CSS3 & Modern Styling (Tailwind / Flexbox / Grid)"
      url: "${MCP_DOCS_BASE_URL:http://localhost:8888}/css"
      transport: SSE
      target: FRONTEND
      description: "Mobile-first responsive design, utility-first CSS via Tailwind, flexbox/grid for layouts, accessible contrast ratios."