spring:
  application:
    name: ai-orchestrator
  ai:
    openai:
      api-key: ${ANYMODEL_API_KEY}
      base-url: ${ANYMODEL_BASE_URL}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT}
  error:
    include-message: always
anymodel:
  api:
    key: ${ANYMODEL_API_KEY}
    base:
      url: ${ANYMODEL_BASE_URL}
agents:
  all:
    url: ${AGENTS_ALL_URL}
    token: ${AGENTS_ALL_TOKEN}
  interviewer:
    url: ${INTERVIEWER_URL}
    token: ${INTERVIEWER_TOKEN}
    model: ${INTERVIEWER_MODEL}
  architect:
    url: ${ARCHITECT_URL}
    token: ${ARCHITECT_TOKEN}
    model: ${ARCHITECT_MODEL}
  worker:
    url: ${WORKER_URL}
    token: ${WORKER_TOKEN}
    model: ${WORKER_MODEL}
  tester:
    url: ${TESTER_URL}
    token: ${TESTER_TOKEN}
    model: ${TESTER_MODEL}
  helper:
    url: ${HELPER_URL}
    token: ${HELPER_TOKEN}
    model: ${HELPER_MODEL}

app:
  admin:
    user:
      name: ${APP_ADMIN_USER_NAME:admin}
      password: ${APP_ADMIN_USER_PASSWORD:admin123}
  output:
    directory: ${OUTPUT_DIRECTORY:./output}

mcp:
  default-servers:
    - name: "Spring Boot Guidelines"
      url: "https://context7.com/spring-projects/spring-boot"
      transport: SSE
    - name: "Hibernate ORM Best Practices"
      url: "https://context7.com/hibernate/hibernate-orm"
      transport: SSE
    - name: "Java Modern Conventions"
      url: "https://context7.com/java/openjdk"
      transport: SSE
    - name: "PostgreSQL Best Practices"
      url: "https://context7.com/postgres/postgres"
      transport: SSE