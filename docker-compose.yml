version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: orchestrator-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong_password_here}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchestrator_user} -d ${POSTGRES_DB:-orchestrator_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - orchestrator-network

  harness:
    build:
      context: ./docker/harness
      dockerfile: Dockerfile
    container_name: orchestrator-harness
    environment:
      ANYMODEL_API_KEY: ${ANYMODEL_API_KEY:-}
      ANYMODEL_BASE_URL: ${ANYMODEL_BASE_URL:-https://anymodel.org/v1}
      HARNESS_CONTEXT: ${HARNESS_CONTEXT:-/app/custom-config}
      NODE_ENV: production
    ports:
      - "3080:3080"
    volumes:
      - ./docker/harness/data:/root/.dsh
      - ./docker/harness/config:/app/custom-config
      - ./output:/output
    restart: unless-stopped
    networks:
      - orchestrator-network

volumes:
  postgres_data:
    driver: local

networks:
  orchestrator-network:
    driver: bridge