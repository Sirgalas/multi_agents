version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: orchestrator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchestrator} -d ${POSTGRES_DB:-orchestrator_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  harness:
    build:
      context: .
      dockerfile: docker/harness/Dockerfile
    container_name: deepseek-harness
    restart: unless-stopped
    environment:
      ANYMODEL_API_KEY: ${ANYMODEL_API_KEY}
      ANYMODEL_BASE_URL: ${ANYMODEL_BASE_URL}
      HARNESS_CONTEXT: ${HARNESS_CONTEXT:-default}
    volumes:
      - ./output:/output
      - ./docker/harness:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: